# webgpu — WebGPU FDTD test bench (static) + relay proxy on Forge.
# Static page at /var/www/webgpu; relay (webgpu-relay.service) on
# 127.0.0.1:8177 handles /agent/ (browser agents) and /api/ (control).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webgpu.muse-workspace.g.codingwell.net;

    ssl_certificate     /etc/letsencrypt/live/webgpu.muse-workspace.g.codingwell.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webgpu.muse-workspace.g.codingwell.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/webgpu;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Browser agents: register / long-poll (25 s) / events / results.
    location /agent/ {
        proxy_pass http://127.0.0.1:8177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    # Control API (Bearer token required by the relay itself).
    location /api/ {
        proxy_pass http://127.0.0.1:8177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name webgpu.muse-workspace.g.codingwell.net;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
