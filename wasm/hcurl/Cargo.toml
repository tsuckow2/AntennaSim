[package]
name = "hcurl-fem"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "H(curl) finite-element solver for time-harmonic electromagnetics: first-order Nedelec edge elements, complex BiCGSTAB with symmetric Gauss-Seidel preconditioning, Silver-Muller absorbing boundary, Stratton-Chu far field. Compiles to WebAssembly for in-browser simulation."
license = "GPL-3.0-or-later"
repository = "https://github.com/EA1FUO/AntennaSim"
homepage = "https://github.com/EA1FUO/AntennaSim"
documentation = "https://github.com/EA1FUO/AntennaSim/tree/main/wasm/hcurl"
keywords = ["fem", "electromagnetics", "hcurl", "nedelec", "wasm"]
categories = ["science", "wasm"]

[lib]
name = "hcurl_fem"
crate-type = ["cdylib", "rlib"]

[dependencies]
num-complex = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Experiment-only: sparse direct solver trials (examples/faer_direct.rs).
# Not linked into the library or WASM builds.
faer = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-rayon = { version = "1", optional = true, features = ["no-bundler"] }

[features]
default = []
# Threaded browser build. Enables the wasm-bindgen-rayon thread pool and the
# #[wasm_bindgen] API surface in src/wasm_api.rs. Requires the nightly
# atomics build documented in README.md ("Browser threads"); enabling it for
# a plain wasm32 build without +atomics is a compile error (by design, from
# wasm-bindgen-rayon). On non-wasm32 targets this feature is a no-op.
wasm-threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
